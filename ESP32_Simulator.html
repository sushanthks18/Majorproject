<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Data Simulator - Krishi Sakha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .sensor-group {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .sensor-input {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-random {
            background: #28a745;
            color: white;
        }
        
        .btn-random:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .icon {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 ESP32 Data Simulator</h1>
        <p class="subtitle">Krishi Sakha - Smart Agriculture System</p>
        
        <div class="info-box">
            <strong>📡 Purpose:</strong> This page simulates ESP32 sensor data to test if your dashboard updates correctly.<br>
            <strong>✅ If this works:</strong> Your system is fine, ESP32 needs to be checked.<br>
            <strong>❌ If this doesn't work:</strong> Backend or WebSocket issue.
        </div>
        
        <div class="sensor-group">
            <div class="sensor-input">
                <label><span class="icon">🌡️</span> Temperature (°C)</label>
                <input type="number" id="temperature" value="28.5" step="0.1" min="0" max="50">
            </div>
            
            <div class="sensor-input">
                <label><span class="icon">💧</span> Humidity (%)</label>
                <input type="number" id="humidity" value="72.3" step="0.1" min="0" max="100">
            </div>
            
            <div class="sensor-input">
                <label><span class="icon">🌱</span> Soil Moisture (%)</label>
                <input type="number" id="soilMoisture" value="65.8" step="0.1" min="0" max="100">
            </div>
            
            <div class="sensor-input">
                <label><span class="icon">🧪</span> pH Level</label>
                <input type="number" id="pH" value="6.5" step="0.1" min="0" max="14">
            </div>
            
            <div class="sensor-input">
                <label><span class="icon">🌧️</span> Rainfall (%)</label>
                <input type="number" id="rainfall" value="12.0" step="0.1" min="0" max="100">
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-random" onclick="randomizeData()">🎲 Random Values</button>
            <button class="btn-send" onclick="sendData()">📡 Send to Dashboard</button>
        </div>
        
        <div id="status" class="status"></div>
    </div>
    
    <script>
        function randomizeData() {
            document.getElementById('temperature').value = (15 + Math.random() * 25).toFixed(1);
            document.getElementById('humidity').value = (40 + Math.random() * 50).toFixed(1);
            document.getElementById('soilMoisture').value = (20 + Math.random() * 70).toFixed(1);
            document.getElementById('pH').value = (5.5 + Math.random() * 3).toFixed(1);
            document.getElementById('rainfall').value = (Math.random() * 50).toFixed(1);
        }
        
        async function sendData() {
            const data = {
                temperature: parseFloat(document.getElementById('temperature').value),
                humidity: parseFloat(document.getElementById('humidity').value),
                soilMoisture: parseFloat(document.getElementById('soilMoisture').value),
                pH: parseFloat(document.getElementById('pH').value),
                rainfall: parseFloat(document.getElementById('rainfall').value),
                deviceId: 'ESP32_SENSOR_001',
                source: 'krishi-sakha'
            };
            
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status';
            statusDiv.textContent = '📡 Sending data...';
            statusDiv.style.display = 'block';
            
            try {
                const response = await fetch('http://localhost:5001/api/sensors/data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = `
                        <strong>✅ SUCCESS!</strong><br>
                        Data sent to backend and broadcasted to dashboard!<br><br>
                        <strong>📊 Sent Values:</strong><br>
                        🌡️ Temperature: ${data.temperature}°C<br>
                        💧 Humidity: ${data.humidity}%<br>
                        🌱 Soil: ${data.soilMoisture}%<br>
                        🧪 pH: ${data.pH}<br>
                        🌧️ Rainfall: ${data.rainfall}%<br><br>
                        <strong>👀 CHECK YOUR DASHBOARD NOW!</strong><br>
                        It should update within 1 second with these values.
                    `;
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.innerHTML = `
                        <strong>❌ ERROR!</strong><br>
                        ${result.error || 'Failed to send data'}<br><br>
                        <strong>Troubleshooting:</strong><br>
                        • Check if backend is running on port 5001<br>
                        • Open browser console (F12) for details
                    `;
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <strong>❌ CONNECTION ERROR!</strong><br>
                    Cannot connect to backend server.<br><br>
                    <strong>Troubleshooting:</strong><br>
                    • Make sure backend is running: <code>cd backend && npm run dev</code><br>
                    • Check if port 5001 is open<br>
                    • Error: ${error.message}
                `;
            }
        }
        
        // Send data automatically on page load to test
        setTimeout(() => {
            console.log('🧪 Auto-testing connection...');
        }, 1000);
    </script>
</body>
</html>
