services:
  # Main Backend API
  - type: web
    name: krishi-sakha-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        fromDatabase:
          name: krishi-sakha-db
          property: connectionString

  # Sensor Backend (ESP32)
  - type: web
    name: krishi-sakha-sensor-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd sensor-backend && npm install
    startCommand: cd sensor-backend && npm start
    envVars:
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false

  # ML API
  - type: web
    name: krishi-sakha-ml-api
    env: python
    region: oregon
    plan: free
    buildCommand: cd ml-model && pip install -r requirements.txt
    startCommand: cd ml-model && python ml_api.py
    envVars:
      - key: PORT
        value: 5002

  # Frontend
  - type: web
    name: krishi-sakha-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://krishi-sakha-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://krishi-sakha-backend.onrender.com

databases:
  - name: krishi-sakha-db
    databaseName: smart_agriculture
    user: krishi_user
    plan: free
